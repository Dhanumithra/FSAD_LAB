<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }

        .page-wrapper {
            max-width: 620px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 2.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 24px rgba(0,0,0,0.08);
        }

        .college-name {
            font-size: 1rem;
            font-weight: 700;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.4rem;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 1.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .info-row {
            display: flex;
            align-items: baseline;
            padding: 0.65rem 0;
            border-bottom: 1px solid #f0f2f5;
            font-size: 0.9rem;
            gap: 1rem;
        }

        .info-row:last-of-type { border-bottom: none; }

        .info-label {
            width: 140px;
            flex-shrink: 0;
            font-weight: 600;
            color: #64748b;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value { color: #1e293b; font-weight: 500; }

        .welcome-banner {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 10px;
            padding: 1rem 1.4rem;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 1.75rem;
            letter-spacing: 0.2px;
        }

        .content-links {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 7px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-primary   { background: #4f46e5; color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
    </style>
</head>

<body>
<div class="page-wrapper">
    <div class="card">
        <p class="college-name">{{ college }}</p>
        <h1 class="section-title">Student Information</h1>

        <div class="info-row">
            <span class="info-label">Name</span>
            <span class="info-value">{{ name }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Roll Number</span>
            <span class="info-value">{{ roll_number }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Course</span>
            <span class="info-value">{{ course }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Year</span>
            <span class="info-value">{{ year }}</span>
        </div>

        <div class="welcome-banner">{{ welcome }}</div>

        <div class="content-links">
            <a href="{% url 'student_list' %}" class="btn btn-primary">Exercise 12</a>
            <a href="{% url 'ex13_home' %}" class="btn btn-secondary">Exercise 13</a>
        </div>
    </div>
</div>
</body>
</html>
