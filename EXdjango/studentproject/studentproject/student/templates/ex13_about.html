{% extends 'ex13_base.html' %}

{% block content %}

<div class="text-center mb-4">
    <h2 class="fw-bold" style="color:#1a1a2e; font-size:1.35rem;">About</h2>
    <p class="text-muted mt-2" style="font-size:0.95rem;">
        This application is developed using Django, MySQL and Bootstrap.
    </p>
</div>

<div class="mx-auto" style="max-width:420px;">
    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:1.5rem;">
        <p class="fw-semibold mb-3" style="color:#475569; font-size:0.78rem;
            text-transform:uppercase; letter-spacing:0.6px;">Technologies Used</p>
        <div style="display:flex; flex-direction:column;">
            {% for tech in techs %}
            <div style="display:flex; align-items:center; gap:0.65rem;
                padding:0.5rem 0; border-bottom:1px solid #f0f2f5;
                font-size:0.9rem; color:#1e293b; font-weight:500;">
                <span style="width:7px; height:7px; background:#4f46e5;
                    border-radius:50%; flex-shrink:0;"></span>
                {{ tech }}
            </div>
            {% empty %}
            <div style="display:flex; align-items:center; gap:0.65rem; padding:0.5rem 0; border-bottom:1px solid #f0f2f5; font-size:0.9rem; color:#1e293b; font-weight:500;"><span style="width:7px; height:7px; background:#4f46e5; border-radius:50%;"></span>Python</div>
            <div style="display:flex; align-items:center; gap:0.65rem; padding:0.5rem 0; border-bottom:1px solid #f0f2f5; font-size:0.9rem; color:#1e293b; font-weight:500;"><span style="width:7px; height:7px; background:#4f46e5; border-radius:50%;"></span>Django</div>
            <div style="display:flex; align-items:center; gap:0.65rem; padding:0.5rem 0; border-bottom:1px solid #f0f2f5; font-size:0.9rem; color:#1e293b; font-weight:500;"><span style="width:7px; height:7px; background:#4f46e5; border-radius:50%;"></span>MySQL</div>
            <div style="display:flex; align-items:center; gap:0.65rem; padding:0.5rem 0; border-bottom:1px solid #f0f2f5; font-size:0.9rem; color:#1e293b; font-weight:500;"><span style="width:7px; height:7px; background:#4f46e5; border-radius:50%;"></span>HTML</div>
            <div style="display:flex; align-items:center; gap:0.65rem; padding:0.5rem 0; border-bottom:1px solid #f0f2f5; font-size:0.9rem; color:#1e293b; font-weight:500;"><span style="width:7px; height:7px; background:#4f46e5; border-radius:50%;"></span>Bootstrap</div>
            <div style="display:flex; align-items:center; gap:0.65rem; padding:0.5rem 0; font-size:0.9rem; color:#1e293b; font-weight:500;"><span style="width:7px; height:7px; background:#4f46e5; border-radius:50%;"></span>Django Templates</div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}
