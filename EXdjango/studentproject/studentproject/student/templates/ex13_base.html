<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
        }

        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%) !important;
            padding: 0 1.5rem;
            height: 64px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.3px;
            color: #e2e8f0 !important;
        }

        .nav-pill-link {
            color: #94a3b8 !important;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 1rem !important;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
        }

        .nav-pill-link:hover {
            background: rgba(255,255,255,0.09) !important;
            color: #f1f5f9 !important;
        }

        .page-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 2rem 2.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 4px 20px rgba(0,0,0,0.07);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'ex13_home' %}">🎓 Student Information System</a>
        <div class="d-flex gap-1">
            <a class="nav-pill-link" href="{% url 'ex13_home' %}">Home</a>
            <a class="nav-pill-link" href="{% url 'ex13_students' %}">Students</a>
            <a class="nav-pill-link" href="{% url 'ex13_about' %}">About</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="page-card">
        {% block content %}
        {% endblock %}
    </div>
</div>

</body>
</html>
