{% extends 'base.html' %}

{% block content %}

<h1 class="page-title">Update Student</h1>

{% if error %}
    <div class="alert-error">{{ error }}</div>
{% endif %}

{% if student %}
<form method="POST" style="max-width: 480px;">
    {% csrf_token %}

    <div class="form-group">
        <label for="name">Student Name</label>
        <input type="text" id="name" name="name" value="{{ student.name }}">
    </div>

    <div class="form-group">
        <label for="roll_number">Roll Number</label>
        <input type="text" id="roll_number" name="roll_number" value="{{ student.roll_number }}">
    </div>

    <div class="form-group">
        <label for="course">Course</label>
        <input type="text" id="course" name="course" value="{{ student.course }}">
    </div>

    <div class="form-group">
        <label for="year">Year</label>
        <input type="text" id="year" name="year" value="{{ student.year }}">
    </div>

    <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
        <button type="submit" class="btn btn-warning">Update Student</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endif %}

{% endblock %}
