<div class="container">
  <h2>User List</h2>

  @if (loading()) {
    <p class="loading">Loading users...</p>
  }

  <ul>
    @for (user of userlist(); track user.id) {
      <li>
        <span class="name">{{ user.name }}</span>
        <span class="email">{{ user.email }}</span>
      </li>
    } @empty {
      @if (!loading()) {
        <li>No users found.</li>
      }
    }
  </ul>
</div>
